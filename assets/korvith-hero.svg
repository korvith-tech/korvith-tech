<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#0A142A" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19D3FF" />
      <stop offset="100%" stop-color="#168BFF" />
    </linearGradient>

    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#E62F30" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19D3FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#19D3FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E62F30" stop-opacity="0" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="meshGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#168BFF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#19D3FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E62F30" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#19D3FF" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="highGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .flow-line-1 {
      stroke-dasharray: 8 16;
      animation: dashStream 25s linear infinite;
    }
    .flow-line-2 {
      stroke-dasharray: 6 12;
      animation: dashStreamRev 18s linear infinite;
    }
    .node-ping {
      animation: pingNode 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: center;
    }
    .radar-beam {
      animation: radarRotate 12s linear infinite;
      transform-origin: 980px 220px;
    }
    .scanner-beam {
      animation: scanSweep 6s ease-in-out infinite;
    }
    .status-blink {
      animation: blink 2s ease-in-out infinite;
    }
    .orbit-1 {
      animation: orbit 14s linear infinite;
      transform-origin: 980px 220px;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.6; filter: drop-shadow(0 0 4px #19D3FF); }
      50% { opacity: 0.9; filter: drop-shadow(0 0 16px #168BFF); }
      100% { opacity: 0.7; filter: drop-shadow(0 0 8px #19D3FF); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -400; }
    }
    @keyframes dashStreamRev {
      to { stroke-dashoffset: 400; }
    }
    @keyframes pingNode {
      0% { r: 3; opacity: 1; }
      75%, 100% { r: 16; opacity: 0; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes scanSweep {
      0%, 100% { transform: translateY(0); opacity: 0.1; }
      50% { transform: translateY(440px); opacity: 0.4; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="460" rx="20" fill="url(#bgGrad)" />

  <!-- Radial Atmosphere Lighting -->
  <rect width="1200" height="460" rx="20" fill="url(#meshGlow)" />
  <rect width="1200" height="460" rx="20" fill="url(#redGlow)" />

  <!-- Geometric Grid Layer -->
  <rect width="1200" height="460" rx="20" fill="url(#grid)" />

  <!-- Outer Cyber Border -->
  <rect x="1.5" y="1.5" width="1197" height="457" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="4" fill="url(#neonGlow)" />

  <!-- Animated Scanner Bar -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#19D3FF" stroke-width="1" stroke-opacity="0.3" class="scanner-beam" />

  <!-- Corner Engineering Framing Brackets -->
  <g stroke="#19D3FF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 20 40 L 20 20 L 40 20" />
    <path d="M 1180 40 L 1180 20 L 1160 20" />
    <path d="M 20 420 L 20 440 L 40 440" />
    <path d="M 1180 420 L 1180 440 L 1160 440" />
  </g>

  <!-- ==================== RIGHT SIDE: ANIMATED SYSTEM ARCHITECTURE / TOPOLOGY ==================== -->
  <g transform="translate(0, 0)">
    <!-- Circuit Connection Flowlines -->
    <g stroke="#1E3A8A" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M 680 140 L 760 140 L 820 180 L 980 180" class="flow-line-1" stroke="#19D3FF" />
      <path d="M 680 230 L 790 230 L 850 220 L 980 220" class="flow-line-2" stroke="#E62F30" />
      <path d="M 680 320 L 770 320 L 830 260 L 980 260" class="flow-line-1" stroke="#168BFF" />
      <path d="M 980 100 L 980 340" stroke="#334155" stroke-dasharray="4 4" />
      <path d="M 860 220 L 1100 220" stroke="#334155" stroke-dasharray="4 4" />
    </g>

    <!-- Radar System Display -->
    <g transform="translate(0, 0)">
      <!-- Outer Target Rings -->
      <circle cx="980" cy="220" r="140" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8" />
      <circle cx="980" cy="220" r="105" fill="none" stroke="#168BFF" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="980" cy="220" r="70" fill="none" stroke="#19D3FF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 6" />
      <circle cx="980" cy="220" r="35" fill="none" stroke="#334155" stroke-width="1" />

      <!-- Rotating Scanner Beam -->
      <line x1="980" y1="220" x2="1120" y2="220" stroke="url(#cyanBlue)" stroke-width="2" class="radar-beam" stroke-linecap="round" opacity="0.8" />

      <!-- Central Emblem Glow Sphere -->
      <circle cx="980" cy="220" r="45" fill="#0B1226" stroke="url(#cyanBlue)" stroke-width="2" filter="url(#softGlow)" />
      
      <!-- Central Geometric Korvith 'K' Mark Inside Topology Node -->
      <g transform="translate(965, 201) scale(0.12)" class="pulse-glow">
        <path d="M 67 0 L 51 15 L 46 20 L 0 64 L 0 184 L 67 118 Z" fill="#19D3FF" />
        <path d="M 281 41 L 167 40 L 148 55 L 1 202 L 0 316 Z" fill="#168BFF" />
        <path d="M 86 255 L 126 296 L 157 327 L 285 327 L 228 267 L 154 191 Z" fill="#19D3FF" />
      </g>

      <!-- Satellite Orbiting Nodes -->
      <g class="orbit-1">
        <circle cx="1085" cy="220" r="5" fill="#19D3FF" filter="url(#softGlow)" />
        <circle cx="875" cy="220" r="4" fill="#E62F30" filter="url(#softGlow)" />
      </g>

      <!-- Active Pinging Nodes -->
      <circle cx="820" cy="180" r="4" fill="#19D3FF" />
      <circle cx="820" cy="180" r="4" fill="none" stroke="#19D3FF" stroke-width="1.5" class="node-ping" />

      <circle cx="850" cy="220" r="4" fill="#E62F30" />
      <circle cx="850" cy="220" r="4" fill="none" stroke="#E62F30" stroke-width="1.5" class="node-ping" style="animation-delay: 1.2s;" />

      <circle cx="830" cy="260" r="4" fill="#168BFF" />
      <circle cx="830" cy="260" r="4" fill="none" stroke="#168BFF" stroke-width="1.5" class="node-ping" style="animation-delay: 0.6s;" />

      <!-- Data Hub Labels -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">
        <text x="890" y="90">SYS // DISTRIBUTED</text>
        <text x="1050" y="340">LATENCY // 18ms</text>
        <text x="880" y="360">NODE // IN-N1 (DELHI)</text>
      </g>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: BRANDING, HEADLINE & EDITORIAL CONTENT ==================== -->
  
  <!-- System Status Telemetry Pill -->
  <g transform="translate(70, 52)">
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#0C152B" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#10B981" class="status-blink" />
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">PRODUCTION READY</text>
    <line x1="168" y1="8" x2="168" y2="20" stroke="#1E293B" stroke-width="1.5" />
    <text x="180" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">DEHRADUN · NATIONWIDE REMOTE</text>
  </g>

  <!-- Main Brand Title Group -->
  <g transform="translate(70, 126)">
    <!-- Small Category Kicker -->
    <text x="2" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="800" letter-spacing="5" fill="#E62F30">KORVITH TECHNOLOGIES</text>
    
    <!-- Primary Hero Statement -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      ENGINEERING
    </text>
    <text x="340" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#cyanBlue)">
      DIGITAL
    </text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      EXPERIENCES<tspan fill="#E62F30">.</tspan>
    </text>
  </g>

  <!-- Supporting Strategic Positioning Copy -->
  <g transform="translate(70, 260)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      High-performance web applications, custom software platforms, intelligent AI
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      integrations, and business process automation built for measurable business goals.
    </text>
  </g>

  <!-- Capability Matrix Pills Row -->
  <g transform="translate(70, 316)">
    <!-- Pill 1: Web Apps -->
    <g transform="translate(0, 0)">
      <rect width="138" height="32" rx="8" fill="#0C152B" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="14" cy="16" r="3" fill="#19D3FF" />
      <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Web Apps &amp; ERP</text>
    </g>

    <!-- Pill 2: AI & Automation -->
    <g transform="translate(148, 0)">
      <rect width="144" height="32" rx="8" fill="#0C152B" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="14" cy="16" r="3" fill="#E62F30" />
      <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">AI &amp; Workflows</text>
    </g>

    <!-- Pill 3: E-Commerce -->
    <g transform="translate(302, 0)">
      <rect width="128" height="32" rx="8" fill="#0C152B" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="14" cy="16" r="3" fill="#10B981" />
      <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">E-Commerce</text>
    </g>

    <!-- Pill 4: Technical SEO -->
    <g transform="translate(440, 0)">
      <rect width="128" height="32" rx="8" fill="#0C152B" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="14" cy="16" r="3" fill="#F59E0B" />
      <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Technical SEO</text>
    </g>
  </g>

  <!-- Bottom Telemetry Footer Strip -->
  <g transform="translate(70, 410)">
    <!-- Decorative Division Line -->
    <line x1="0" y1="-26" x2="600" y2="-26" stroke="#1E293B" stroke-width="1" />
    
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1">
      <text x="0" y="0">CORE // <tspan fill="#38BDF8">NEXT.JS</tspan> · <tspan fill="#38BDF8">REACT</tspan> · <tspan fill="#38BDF8">NODE</tspan> · <tspan fill="#38BDF8">PYTHON</tspan></text>
      <text x="320" y="0">ARCHITECTURE // <tspan fill="#F8FAFC">EVENT-DRIVEN &amp; SECURE</tspan></text>
    </g>
  </g>

  <!-- Ambient Light Reflection on Top Edge -->
  <path d="M 100 2 Q 600 6 1100 2" stroke="url(#cyanBlue)" stroke-width="1" stroke-opacity="0.4" fill="none" />
</svg>
