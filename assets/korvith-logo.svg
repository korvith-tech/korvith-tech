<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19D3FF" />
      <stop offset="50%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#E62F30" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mark-arm {
      animation: armPulse 4s ease-in-out infinite alternate;
    }
    .red-dot {
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes armPulse {
      0% { filter: drop-shadow(0 0 2px rgba(25, 211, 255, 0.4)); opacity: 0.95; }
      100% { filter: drop-shadow(0 0 8px rgba(25, 211, 255, 0.8)); opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>

  <!-- Emblem Box / Background -->
  <g transform="translate(20, 15)">
    <!-- Rounded Container -->
    <rect x="0" y="0" width="90" height="90" rx="20" fill="#0B1020" stroke="#1E293B" stroke-width="2" />
    <rect x="0" y="0" width="90" height="90" rx="20" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Stylized Geometric 'K' Mark -->
    <g transform="translate(18, 14) scale(0.19)" class="mark-arm">
      <!-- Upper diagonal arm -->
      <path d="M 67 0 L 51 15 L 46 20 L 0 64 L 0 184 L 67 118 Z" fill="url(#logoGrad)" />
      <!-- Main angled diagonal bar -->
      <path d="M 281 41 L 167 40 L 148 55 L 1 202 L 0 316 Z" fill="url(#logoGrad)" />
      <!-- Lower diagonal arm -->
      <path d="M 86 255 L 126 296 L 157 327 L 285 327 L 228 267 L 154 191 Z" fill="url(#logoGrad)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 62)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#FFFFFF">KORVITH</text>
    <!-- Brand Red Dot Accent -->
    <circle cx="218" cy="-8" r="4.5" fill="url(#redAccent)" class="red-dot" />
  </g>

  <g transform="translate(132, 88)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="8" fill="#94A3B8">TECHNOLOGIES</text>
  </g>

  <!-- Subtle Indian Flag Node Motif / Tech Pill -->
  <g transform="translate(380, 48)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#10B981" />
    <text x="24" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#94A3B8">IN · 2026</text>
  </g>
</svg>
