<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <linearGradient id="scPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="borderSc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .live-pulse { animation: livePulse 2s ease-in-out infinite; }
    @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
  </style>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#scBg)" stroke="url(#borderSc)" stroke-width="1.5" />

  <!-- Left Visual Accent: Institutional Columns Motif -->
  <g transform="translate(35, 30)">
    <rect width="180" height="115" rx="10" fill="#060912" stroke="#A855F7" stroke-width="1.5" />
    <!-- Classic Portal / University Facade -->
    <path d="M 50 50 L 90 30 L 130 50 Z" fill="none" stroke="#A855F7" stroke-width="1.8" />
    <line x1="60" y1="50" x2="60" y2="90" stroke="#A855F7" stroke-width="1.8" />
    <line x1="80" y1="50" x2="80" y2="90" stroke="#A855F7" stroke-width="1.8" />
    <line x1="100" y1="50" x2="100" y2="90" stroke="#A855F7" stroke-width="1.8" />
    <line x1="120" y1="50" x2="120" y2="90" stroke="#A855F7" stroke-width="1.8" />
    <rect x="45" y="90" width="90" height="8" rx="1" fill="#A855F7" />
    <text x="90" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SHIVALIK PORTAL</text>
    
    <g transform="translate(18, 130)">
      <rect width="144" height="26" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#10B981" class="live-pulse" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="700" fill="#C084FC">RESPONSIVE REDESIGN</text>
    </g>
  </g>

  <!-- Content Group -->
  <g transform="translate(255, 34)">
    <g>
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">
        Shivalik College — Institutional Portal Modernization
      </text>
      <!-- Live Status Pill -->
      <g transform="translate(500, -18)">
        <rect width="95" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1" />
        <circle cx="12" cy="11" r="3" fill="#34D399" class="live-pulse" />
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#A7F3D0" letter-spacing="0.5">LIVE DEMO</text>
      </g>
    </g>

    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="1">
      ENTERPRISE UX · ACADEMIC NAVIGATION · PERFORMANCE MODERNIZATION
    </text>

    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      Comprehensive institutional redesign transforming navigation hierarchies, department directories,
    </text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      and student admissions journeys into a fast, mobile-first, modern responsive experience.
    </text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      Engineered with Vite and Framer Motion for smooth micro-interactions.
    </text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="70" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="35" y="16" fill="#38BDF8" text-anchor="middle">React</text>
      </g>
      <g transform="translate(78, 0)">
        <rect width="65" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="32" y="16" fill="#38BDF8" text-anchor="middle">Vite</text>
      </g>
      <g transform="translate(151, 0)">
        <rect width="105" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="52" y="16" fill="#38BDF8" text-anchor="middle">Tailwind CSS</text>
      </g>
      <g transform="translate(264, 0)">
        <rect width="120" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="60" y="16" fill="#38BDF8" text-anchor="middle">Framer Motion</text>
      </g>
      <g transform="translate(392, 0)">
        <rect width="80" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="40" y="16" fill="#38BDF8" text-anchor="middle">Netlify</text>
      </g>
    </g>

    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#C084FC">
      URL: https://shivalik-redesign.netlify.app →
    </text>
  </g>
</svg>
