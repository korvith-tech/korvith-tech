<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>

    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1B38" />
      <stop offset="100%" stop-color="#0D172E" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19D3FF" />
      <stop offset="100%" stop-color="#168BFF" />
    </linearGradient>

    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .packet-stream {
      stroke-dasharray: 4 8;
      animation: streamFlow 10s linear infinite;
    }
    .status-pulse {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes streamFlow {
      to { stroke-dashoffset: -120; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #19D3FF); }
    }
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="1098" height="438" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Architecture Header Strip -->
  <g transform="translate(35, 24)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" letter-spacing="2" fill="#E62F30">SYSTEM ARCHITECTURE (ILLUSTRATIVE MODEL)</text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">High-Reliability Multi-Tier Web Architecture Tailored per Solution</text>
  </g>

  <!-- Central Connecting Spine Line -->
  <line x1="550" y1="65" x2="550" y2="400" stroke="#1E293B" stroke-width="2" />
  <line x1="550" y1="65" x2="550" y2="400" stroke="url(#cyanLine)" stroke-width="2" class="packet-stream" />

  <!-- ==================== LAYER 1: CLIENTS & USERS ==================== -->
  <g transform="translate(45, 60)">
    <rect width="1010" height="46" rx="8" fill="url(#layerGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="25" cy="23" r="4" fill="#19D3FF" />
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="800" fill="#38BDF8">01 // CLIENTS &amp; USERS</text>
    
    <g transform="translate(240, 11)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="80" y="16" text-anchor="middle">Responsive Web (Mobile/Desktop)</text>

      <rect x="180" y="0" width="150" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="255" y="16" text-anchor="middle">Client Dashboards &amp; Portals</text>

      <rect x="350" y="0" width="160" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="430" y="16" text-anchor="middle">In-Person QR Verification</text>

      <rect x="530" y="0" width="170" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="615" y="16" text-anchor="middle">Global Edge CDN Entrypoint</text>
    </g>
  </g>

  <!-- ==================== LAYER 2: INTERFACE & EDGE DELIVERY ==================== -->
  <g transform="translate(45, 120)">
    <rect width="1010" height="52" rx="8" fill="url(#layerGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="25" cy="26" r="4" fill="#168BFF" />
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="800" fill="#38BDF8">02 // EDGE &amp; FRONTEND</text>

    <g transform="translate(240, 14)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle">Next.js / React SSR</text>

      <rect x="155" y="0" width="160" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="235" y="16" text-anchor="middle">Tailwind CSS / Motion</text>

      <rect x="330" y="0" width="170" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="415" y="16" text-anchor="middle">SSL / DNS / Edge Cache</text>

      <rect x="515" y="0" width="180" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="605" y="16" text-anchor="middle">Vercel &amp; Netlify Pipelines</text>
    </g>
  </g>

  <!-- ==================== LAYER 3: APPLICATION & API GATEWAY ==================== -->
  <g transform="translate(45, 185)">
    <rect width="1010" height="52" rx="8" fill="url(#layerGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="25" cy="26" r="4" fill="#10B981" />
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="800" fill="#38BDF8">03 // APPLICATION &amp; API</text>

    <g transform="translate(240, 14)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">
      <rect x="0" y="0" width="150" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="75" y="16" text-anchor="middle">Node.js / Express Services</text>

      <rect x="165" y="0" width="150" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="240" y="16" text-anchor="middle">REST / Server Functions</text>

      <rect x="330" y="0" width="170" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="415" y="16" text-anchor="middle">Socket.io Realtime Sync</text>

      <rect x="515" y="0" width="180" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="605" y="16" text-anchor="middle">JWT &amp; RBAC Authorization</text>
    </g>
  </g>

  <!-- ==================== LAYER 4: BUSINESS LOGIC & AUTOMATION ==================== -->
  <g transform="translate(45, 250)">
    <rect width="1010" height="52" rx="8" fill="url(#layerGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="25" cy="26" r="4" fill="#F59E0B" />
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="800" fill="#38BDF8">04 // LOGIC &amp; WORKFLOW</text>

    <g transform="translate(240, 14)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="80" y="16" text-anchor="middle">Commerce Checkout Engines</text>

      <rect x="175" y="0" width="155" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="252" y="16" text-anchor="middle">AI Integration &amp; Prompts</text>

      <rect x="345" y="0" width="170" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="430" y="16" text-anchor="middle">Cryptographic Verification</text>

      <rect x="530" y="0" width="170" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="615" y="16" text-anchor="middle">Automated Webhooks</text>
    </g>
  </g>

  <!-- ==================== LAYER 5: PERSISTENCE & INTEGRATIONS ==================== -->
  <g transform="translate(45, 315)">
    <rect width="1010" height="52" rx="8" fill="url(#layerGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="25" cy="26" r="4" fill="#E62F30" />
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="800" fill="#38BDF8">05 // DATA &amp; INTEGRATIONS</text>

    <g transform="translate(240, 14)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle">PostgreSQL / Supabase</text>

      <rect x="155" y="0" width="125" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="62" y="16" text-anchor="middle">MongoDB</text>

      <rect x="295" y="0" width="175" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="87" y="16" text-anchor="middle">Razorpay UPI &amp; Cards</text>

      <rect x="485" y="0" width="140" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle">WhatsApp Business API</text>

      <rect x="640" y="0" width="110" height="24" rx="4" fill="#060C1B" stroke="#334155" stroke-width="1" />
      <text x="55" y="16" text-anchor="middle">Cloudinary</text>
    </g>
  </g>

  <!-- ==================== LAYER 6: OBSERVABILITY & SECURITY ==================== -->
  <g transform="translate(45, 380)">
    <rect width="1010" height="40" rx="8" fill="#060C1A" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="20" r="4" fill="#A855F7" />
    <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#C084FC">06 // SECURITY &amp; MONITORING</text>
    
    <g transform="translate(240, 10)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">
      <text x="0" y="14">Secrets Kept Out of Version Control</text>
      <circle cx="215" cy="10" r="2.5" fill="#334155" />
      <text x="230" y="14">Strict Input Sanitization</text>
      <circle cx="375" cy="10" r="2.5" fill="#334155" />
      <text x="390" y="14">HTTPS / SSL Strict Handshake</text>
      <circle cx="560" cy="10" r="2.5" fill="#334155" />
      <text x="575" y="14">Continuous Deployment &amp; Health Monitoring</text>
    </g>
  </g>
</svg>
