<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <linearGradient id="pgAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="borderPg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .live-pulse { animation: livePulse 2s ease-in-out infinite; }
    @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
  </style>

  <!-- Card Body -->
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#pgBg)" stroke="url(#borderPg)" stroke-width="1.5" />

  <!-- Left Visual Accent: Golden/Amber Membership Card Graphic -->
  <g transform="translate(35, 30)">
    <rect width="180" height="115" rx="10" fill="#060912" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="10" y="12" width="30" height="20" rx="3" fill="#D97706" />
    <line x1="10" y1="50" x2="170" y2="50" stroke="#1E293B" stroke-width="8" />
    <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="800" fill="#FDE68A" letter-spacing="2">•••• •••• •••• 9893</text>
    <text x="14" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8">PENNYGRADE MEMBER</text>
    <text x="140" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#F59E0B">OFFLINE</text>
    
    <!-- QR Code Mock Motif -->
    <g transform="translate(18, 130)">
      <rect width="144" height="26" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#10B981" class="live-pulse" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="700" fill="#38BDF8">5-MIN CRYPTO COUNTER</text>
    </g>
  </g>

  <!-- Content Group -->
  <g transform="translate(255, 34)">
    <!-- Header Row -->
    <g>
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">
        PennyGrade — Physical Card Discount Network
      </text>
      <!-- Live Status Pill -->
      <g transform="translate(500, -18)">
        <rect width="95" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1" />
        <circle cx="12" cy="11" r="3" fill="#34D399" class="live-pulse" />
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#A7F3D0" letter-spacing="0.5">LIVE DEMO</text>
      </g>
    </g>

    <!-- Subtitle / Meta -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1">
      OFFLINE-TO-ONLINE · INSTANT REDEMPTION · ZERO APP DOWNLOAD
    </text>

    <!-- Scope Description -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      Smart physical discount card platform providing guaranteed in-person savings across 120+ dining,
    </text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      wellness and retail partners. Features a 5-minute cryptographic countdown verification screen
    </text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      for merchant staff with zero POS modification.
    </text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="70" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="35" y="16" fill="#38BDF8" text-anchor="middle">React</text>
      </g>
      <g transform="translate(78, 0)">
        <rect width="90" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="45" y="16" fill="#38BDF8" text-anchor="middle">TanStack</text>
      </g>
      <g transform="translate(176, 0)">
        <rect width="95" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="47" y="16" fill="#38BDF8" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(279, 0)">
        <rect width="95" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="47" y="16" fill="#38BDF8" text-anchor="middle">Tailwind CSS</text>
      </g>
      <g transform="translate(382, 0)">
        <rect width="95" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="47" y="16" fill="#38BDF8" text-anchor="middle">Server Fn</text>
      </g>
      <g transform="translate(485, 0)">
        <rect width="90" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="45" y="16" fill="#38BDF8" text-anchor="middle">Netlify</text>
      </g>
    </g>

    <!-- Link indicator -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#F59E0B">
      URL: https://pennygrade.in/ →
    </text>
  </g>
</svg>
