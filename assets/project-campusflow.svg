<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <linearGradient id="cfBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="borderCf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .live-pulse { animation: livePulse 2s ease-in-out infinite; }
    @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
  </style>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#cfBg)" stroke="url(#borderCf)" stroke-width="1.5" />

  <!-- Left Visual Accent: Academic / Realtime Rooms Motif -->
  <g transform="translate(35, 30)">
    <rect width="180" height="115" rx="10" fill="#060912" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Graduation Cap / Collaboration Rooms -->
    <path d="M 90 35 L 140 55 L 90 75 L 40 55 Z" fill="none" stroke="#38BDF8" stroke-width="1.8" />
    <path d="M 60 65 L 60 85 Q 90 100 120 85 L 120 65" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <text x="90" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAMPUS FLOW</text>
    <text x="90" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#BAE6FD" text-anchor="middle">ACADEMIC HUB</text>
    
    <g transform="translate(18, 130)">
      <rect width="144" height="26" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#10B981" class="live-pulse" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="700" fill="#38BDF8">REALTIME SOCKET.IO</text>
    </g>
  </g>

  <!-- Content Group -->
  <g transform="translate(255, 34)">
    <g>
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">
        Campus Flow — Student Academic &amp; Collaboration Platform
      </text>
      <!-- Live Status Pill -->
      <g transform="translate(500, -18)">
        <rect width="95" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1" />
        <circle cx="12" cy="11" r="3" fill="#34D399" class="live-pulse" />
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#A7F3D0" letter-spacing="0.5">LIVE DEMO</text>
      </g>
    </g>

    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">
      FULLSTACK · REALTIME WEBSOCKETS · STUDY ROOMS &amp; CURATED PYQs
    </text>

    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      Next-generation academic platform providing verified lecture notes, previous year question papers
    </text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      (PYQs), virtual focus study rooms with Pomodoro timers, and peer study collaboration hubs.
    </text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#CBD5E1">
      Engineered with Socket.io for low-latency live messaging and peer coordination.
    </text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="70" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="35" y="16" fill="#38BDF8" text-anchor="middle">React</text>
      </g>
      <g transform="translate(78, 0)">
        <rect width="80" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="40" y="16" fill="#38BDF8" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(166, 0)">
        <rect width="80" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="40" y="16" fill="#38BDF8" text-anchor="middle">Express</text>
      </g>
      <g transform="translate(254, 0)">
        <rect width="90" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="45" y="16" fill="#38BDF8" text-anchor="middle">MongoDB</text>
      </g>
      <g transform="translate(352, 0)">
        <rect width="95" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="47" y="16" fill="#38BDF8" text-anchor="middle">Socket.io</text>
      </g>
      <g transform="translate(455, 0)">
        <rect width="105" height="24" rx="6" fill="#0C152B" stroke="#334155" stroke-width="1" />
        <text x="52" y="16" fill="#38BDF8" text-anchor="middle">Tailwind CSS</text>
      </g>
    </g>

    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38BDF8">
      URL: https://mycampusflow.live/ →
    </text>
  </g>
</svg>
