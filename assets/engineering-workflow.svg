<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1B38" />
      <stop offset="100%" stop-color="#091024" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19D3FF" />
      <stop offset="50%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#E62F30" />
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .flow-stream {
      stroke-dasharray: 6 10;
      animation: wfStream 12s linear infinite;
    }
    .node-pulse {
      animation: nodeBlink 3s ease-in-out infinite;
    }
    @keyframes wfStream {
      to { stroke-dashoffset: -200; }
    }
    @keyframes nodeBlink {
      0%, 100% { filter: drop-shadow(0 0 2px #19D3FF); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 8px #19D3FF); opacity: 1; }
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="1098" height="278" rx="18" fill="url(#wfBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top System Badge -->
  <g transform="translate(35, 24)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" letter-spacing="2" fill="#E62F30">KORVITH DELIVERY FRAMEWORK</text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Adaptable Engineering Lifecycle (Tailored to Project Scope)</text>
  </g>

  <!-- Continuous Connecting Circuit Line -->
  <line x1="85" y1="120" x2="1015" y2="120" stroke="#1E293B" stroke-width="3" />
  <line x1="85" y1="120" x2="1015" y2="120" stroke="url(#lineGrad)" stroke-width="2" class="flow-stream" />

  <!-- STAGE 1: DISCOVER -->
  <g transform="translate(45, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#19D3FF" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Magnifying Glass / Target -->
    <path d="M 60 40 A 5 5 0 1 1 70 40 A 5 5 0 1 1 60 40 M 68 44 L 73 49" stroke="#19D3FF" stroke-width="1.8" fill="none" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">01 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">DISCOVER</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Business Needs &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Feasibility Scope</text>
  </g>

  <!-- STAGE 2: PLAN -->
  <g transform="translate(195, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#19D3FF" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Blueprint / Grid -->
    <rect x="57" y="37" width="16" height="16" rx="2" fill="none" stroke="#19D3FF" stroke-width="1.8" />
    <line x1="65" y1="37" x2="65" y2="53" stroke="#19D3FF" stroke-width="1" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">02 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">PLAN</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Architecture Specs &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Tech Stack Fit</text>
  </g>

  <!-- STAGE 3: DESIGN -->
  <g transform="translate(345, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#168BFF" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Vector Pen / Layout -->
    <circle cx="65" cy="45" r="5" fill="none" stroke="#168BFF" stroke-width="1.8" />
    <line x1="60" y1="45" x2="55" y2="45" stroke="#168BFF" stroke-width="1.5" />
    <line x1="70" y1="45" x2="75" y2="45" stroke="#168BFF" stroke-width="1.5" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">03 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">DESIGN</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">High-Fidelity UI/UX &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Responsive Flows</text>
  </g>

  <!-- STAGE 4: BUILD -->
  <g transform="translate(495, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#168BFF" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Code Brackets -->
    <path d="M 59 40 L 54 45 L 59 50 M 71 40 L 76 45 L 71 50" stroke="#168BFF" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">04 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">BUILD</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Frontend, API &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">System Engineering</text>
  </g>

  <!-- STAGE 5: TEST -->
  <g transform="translate(645, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#38BDF8" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Checkshield -->
    <path d="M 57 41 L 65 37 L 73 41 C 73 48 65 53 65 53 C 65 53 57 48 57 41 Z" stroke="#38BDF8" stroke-width="1.8" fill="none" />
    <path d="M 62 45 L 64 47 L 68 43" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">05 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">TEST</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Cross-Device, Speed &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Edge Case Checks</text>
  </g>

  <!-- STAGE 6: DEPLOY -->
  <g transform="translate(795, 75)">
    <rect width="130" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="65" cy="45" r="22" fill="#060B17" stroke="#E62F30" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Rocket / Cloud -->
    <path d="M 65 37 C 62 42 62 47 62 49 L 68 49 C 68 47 68 42 65 37 Z M 60 48 L 57 52 M 70 48 L 73 52" stroke="#E62F30" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#E62F30" text-anchor="middle">06 // STEP</text>
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">DEPLOY</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Production Release &amp;</text>
    <text x="65" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">DNS / SSL Setup</text>
  </g>

  <!-- STAGE 7: IMPROVE -->
  <g transform="translate(945, 75)">
    <rect width="110" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="55" cy="45" r="22" fill="#060B17" stroke="#10B981" stroke-width="1.5" class="node-pulse" />
    <!-- Icon: Continuous Loop -->
    <path d="M 48 45 A 7 7 0 0 1 62 45 A 7 7 0 0 1 48 45 Z" stroke="#10B981" stroke-width="1.8" fill="none" />
    <text x="55" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#10B981" text-anchor="middle">07 // STEP</text>
    <text x="55" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">IMPROVE</text>
    <text x="55" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Iterative Polish &amp;</text>
    <text x="55" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Agreed Support</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(550, 256)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">
    <text>NOTE: DELIVERY FLOW IS ADAPTED COLLABORATIVELY BASED ON SCOPE, TIMELINE &amp; ARCHITECTURAL REQUIREMENTS</text>
  </g>
</svg>
